[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bekas-gpu-worker"
version = "0.1.0"
description = "BEKAS mesh worker for Vast.ai GPU instances"
requires-python = ">=3.10,<3.14"
dependencies = [
  "httpx>=0.27,<1.0",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1.0"]

[project.scripts]
bekas-gpu-worker = "bekas_gpu_worker.worker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bekas_gpu_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
